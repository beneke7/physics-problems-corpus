<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<meta name="robots" content="noindex,nofollow">
	<title>physics problem finder · record</title>
	<script>
		window.MathJax = {
			tex: { inlineMath: [["\\(", "\\)"], ["$", "$"]], displayMath: [["\\[", "\\]"], ["$$", "$$"]], packages: {"[+]": ["ams"]} },
			loader: { load: ["[tex]/ams"] },
			options: { skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"] },
			startup: { ready() { MathJax.startup.defaultReady(); window.dispatchEvent(new Event("MathJaxReady")); } }
		};
	</script>
	<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
	<style>
		:root { --bg:#fff; --text:#222; --muted:#666; --line:#ccc; --red:#c00; }
		* { box-sizing:border-box; }
		body { margin:0; color:var(--text); background:var(--bg); font:14px/1.5 Verdana,Geneva,sans-serif; }
		main, #gate { width:min(980px,calc(100% - 28px)); margin:auto; }
		a { color:var(--red); }
		a:visited { color:#551a8b; }
		h1 { margin:0; font:700 20px/1.2 Georgia,serif; }
		header { display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:18px 0 10px; border-bottom:3px solid var(--red); }
		#gate { max-width:600px; padding-top:22vh; }
		#gate h1 { margin-bottom:12px; }
		form { display:flex; gap:7px; }
		input, select, button { min-height:32px; border:1px solid #aaa; border-radius:2px; background:#fff; color:var(--text); font:inherit; }
		input { min-width:0; padding:7px; }
		form input { flex:1; }
		button { padding:5px 10px; cursor:pointer; }
		button:hover, button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--red); outline-offset:1px; }
		.muted, #status { color:var(--muted); }
		#gate-message { font-size:12px; }
		.meta { color:var(--muted); font-size:13px; }
		.toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:12px 0; border-bottom:1px solid var(--line); }
		.toolbar select { min-width:180px; }
		#download-md, #download-package { border-color:var(--red); color:var(--red); text-decoration:none; }
		#document-content { max-width:820px; margin:0 auto; padding:18px 0 28px; font-family:Georgia,'Times New Roman',serif; font-size:17px; }
		#document-content h1, #document-content h2, #document-content h3 { margin:1.2em 0 .35em; }
		#document-content h1 { font-size:28px; } #document-content h2 { font-size:23px; } #document-content h3 { font-size:19px; }
		#document-content p { margin:.7em 0; }
		#document-content img { display:block; max-width:100%; height:auto; margin:14px auto; }
		#document-content pre { overflow:auto; padding:10px; background:#f5f5f5; font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace; }
		#document-content code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
		#document-content blockquote { margin-left:0; padding-left:14px; border-left:3px solid var(--line); color:#555; }
		#document-note { margin:-4px 0 12px; color:#900; font-size:12px; }
		#figures { max-width:820px; margin:0 auto; border-top:1px solid var(--line); padding:14px 0; }
		#figures h2 { margin:0 0 10px; font:700 16px Georgia,serif; }
		.figure { margin:12px 0 20px; }
		.figure img { display:block; max-width:100%; max-height:600px; height:auto; margin:0 auto; }
		.figure a { font-size:12px; }
		.error { padding:24px 0; color:#900; }
		@media (max-width:600px) { main,#gate { width:calc(100% - 20px); } form { flex-wrap:wrap; } form input,form button { flex:1 1 100%; } .toolbar>* { flex:1 1 100%; } #document-content { font-size:16px; } }
	</style>
</head>
<body>
	<section id="gate">
		<h1>physics problem finder · internal</h1>
		<p>Enter the shared key to open the record.</p>
		<form id="unlock"><input id="key" type="password" autocomplete="current-password" placeholder="Shared key"><button>Open record</button></form>
		<p id="gate-message" class="muted" aria-live="polite"></p>
	</section>

	<main id="app" hidden>
		<header><h1>physics problem finder</h1><a href="./">back to finder</a></header>
		<p id="meta" class="meta">Loading record…</p>
		<div class="toolbar">
			<label>Document <select id="document"></select></label>
			<a id="download-md" href="#" download hidden>Download plain MD</a>
			<button id="download-package" type="button" hidden>Download MD + figures</button>
			<span id="status" aria-live="polite"></span>
		</div>
		<p id="document-note" hidden>Source transcription: raw PDF/OCR extraction; formatting and equations may be corrupted.</p>
		<article id="document-content"></article>
		<section id="figures" hidden><h2>Figures</h2><div id="figure-list"></div></section>
	</main>

	<script src="vendor/marked.umd.js"></script>
	<script>
		const $ = (id) => document.getElementById(id);
		const KEY_HASH = "9bc33fdb9f533d2c8161fa9c72f59f4811a834cb71c1f936a5df4d6d2c321bd9";
		const params = new URLSearchParams(location.search), recordId = params.get("id"), standalonePath = params.get("path");
		const array = (v) => Array.isArray(v) ? v : [];
		const text = (v) => v === null || v === undefined ? "" : String(v);
		let catalog, manifest, record, options = [], currentBody = "", currentInfo = {}, packageBody = "", downloadUrl;
		function typeset(node) {
			const run = () => {
				if (!window.MathJax?.typesetPromise) return;
				window.MathJax.typesetClear?.([node]);
				window.MathJax.typesetPromise([node]).catch(() => {});
			};
			if (window.MathJax?.startup?.promise) window.MathJax.startup.promise.then(run);
			else if (window.MathJax?.typesetPromise) run();
			else window.addEventListener("MathJaxReady", run, { once: true });
		}

		async function digest(value) {
			const bytes = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(value));
			return [...new Uint8Array(bytes)].map((b) => b.toString(16).padStart(2, "0")).join("");
		}
		async function unlock(event) {
			event.preventDefault();
			try {
				if (await digest($("key").value) !== KEY_HASH) throw new Error("wrong key");
				sessionStorage.setItem("physics-corpus-internal", "1"); $("gate").hidden = true; $("app").hidden = false; load();
			} catch (_) { $("gate-message").textContent = "That key did not match."; }
		}
		function stripFrontmatter(value) { return value.replace(/^---\n[\s\S]*?\n---\n?/, ""); }
		function cleanDisplay(value) { return value.replace(/\r\n?/g, "\n").replace(/\f/g, "\n\n").replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f\ufffd]/g, " "); }
		function basename(value) { return decodeURIComponent(value.split(/[?#]/)[0].split("/").pop() || ""); }
		function labelFor(key, path) { if (key === "problem") return "Problem"; if (key === "en") return "English translation"; if (key === "hu") return "Hungarian translation"; if (key === "solution") return "Canonical solution"; return `Source transcription ${Number(key.slice(3)) + 1}`; }
		function make(tag, cls, value) { const n = document.createElement(tag); if (cls) n.className = cls; if (value !== undefined) n.textContent = value; return n; }
		function figurePath(src, info) { const name = basename(src); return array(info.figures).find((path) => basename(path) === name) || src; }
		function packageFigurePath(path) { return `figures/${path.replace(/^content\/figures\//, "")}`; }
		function documentFigures(body, info) {
			const paths = array(info.figures).filter((path) => !/^https?:\/\//i.test(path));
			for (const match of body.matchAll(/!\[[^\]]*\]\(([^)]+)\)/g)) {
				const src = match[1].trim().split(/\s+/)[0].replace(/^<|>$/g, "");
				if (!/^https?:\/\//i.test(src)) paths.push(figurePath(src, info));
			}
			return [...new Set(paths)];
		}
		function localizeImages(body, info, forPackage = false) {
			return body.replace(/(!\[[^\]]*\]\()([^)]*)(\))/g, (whole, start, src, end) => {
				const local = figurePath(src, info); if (local === src) return whole;
				return `${start}${forPackage ? packageFigurePath(local) : local}${end}`;
			});
		}
		function escapeHtml(value) { return value.replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;"); }
		function protectSetext(value) {
			let fenced = false;
			return value.split("\n").map((line) => {
				if (/^[ \t]{0,3}(?:`{3,}|~{3,})/.test(line)) { fenced = !fenced; return line; }
				if (fenced) return line;
				if (/^[ \t]{0,3}(?:=+|-+)[ \t]*$/.test(line)) return line.replace(/[=-]/g, "\\$&");
				return /^[ \t]{0,3}#(?:[ \t]|$)/.test(line) ? line.replace("#", "\\#") : line;
			}).join("\n");
		}
		function hasMath(value) { return /(?:^|[^\\])\$\$?|\\[([]/.test(value); }
		function renderMarkdown(value) {
			const math = [], token = () => `MATHJAXTOKEN${math.length - 1}`;
			let body = "", i = 0;
			while (i < value.length) {
				if (value[i] === "`") {
					const run = value.slice(i).match(/^`+/)[0], end = value.indexOf(run, i + run.length);
					if (end >= 0) { body += value.slice(i, end + run.length); i = end + run.length; continue; }
				}
				if ((value.startsWith("```", i) || value.startsWith("~~~", i)) && (i === 0 || value[i - 1] === "\n")) {
					const fence = value[i] === "`" ? "```" : "~~~", end = value.indexOf(`\n${fence}`, i + fence.length);
					if (end >= 0) { const lineEnd = value.indexOf("\n", end + 1); const stop = lineEnd < 0 ? value.length : lineEnd + 1; body += value.slice(i, stop); i = stop; continue; }
				}
				const escaped = i > 0 && value[i - 1] === "\\";
				let close = -1, length = 0;
				if (!escaped && (value.startsWith("\\(", i) || value.startsWith("\\[", i))) {
					const delimiter = value.startsWith("\\(", i) ? "\\)" : "\\]"; close = value.indexOf(delimiter, i + 2); length = 2;
				} else if (!escaped && value.startsWith("$$", i)) { close = value.indexOf("$$", i + 2); length = 2; }
				else if (!escaped && value[i] === "$" && value[i + 1] !== "$") { close = value.indexOf("$", i + 1); while (close > 0 && value[close - 1] === "\\") close = value.indexOf("$", close + 1); length = 1; }
				if (close > i + length) { math.push(value.slice(i, close + length)); body += token(); i = close + length; continue; }
				body += value[i++];
			}
			return marked.parse(protectSetext(body), {gfm:true, breaks:false, html:false})
				.replace(/MATHJAXTOKEN(\d+)/g, (_, index) => escapeHtml(math[Number(index)]))
				.replace(/&lt;br\s*\/?&gt;/gi, "<br>");
		}
		function setDownload(body, name) {
			if (downloadUrl) URL.revokeObjectURL(downloadUrl); downloadUrl = URL.createObjectURL(new Blob([body], {type:"text/markdown;charset=utf-8"}));
			const link = $("download-md"); link.href = downloadUrl; link.download = `${name}.md`; link.hidden = false;
		}
		function renderFigures(info, seen) {
			const box = $("figures"), list = $("figure-list"); list.replaceChildren(); const paths = array(info.figures).filter((path) => !seen.has(path));
			if (!paths.length) { box.hidden = true; return; } box.hidden = false;
			paths.forEach((path) => { const figure = make("div", "figure"), img = document.createElement("img"), link = make("a", "", basename(path)); img.src = path; img.loading = "lazy"; img.decoding = "async"; link.href = path; link.download = basename(path); figure.append(img, link); list.append(figure); });
		}
		function renderBody(body, info, renderMath = true) {
			currentBody = cleanDisplay(stripFrontmatter(body)); currentInfo = {...info, figures: documentFigures(currentBody, info)}; packageBody = localizeImages(currentBody, currentInfo, true); const content = $("document-content"); content.innerHTML = renderMarkdown(currentBody); if (renderMath && hasMath(currentBody)) typeset(content);
			const seen = new Set(); content.querySelectorAll("img").forEach((img) => { const original = img.getAttribute("src") || ""; const local = figurePath(original, currentInfo); if (local !== original) { img.src = local; seen.add(local); } img.loading = "lazy"; img.decoding = "async"; });
			renderFigures(currentInfo, seen); setDownload(currentBody, (record?.id || "solution-ocr") + "-" + $("document").value); const count = array(currentInfo.figures).length; $("download-package").textContent = count ? `Download MD + ${count} figure${count === 1 ? "" : "s"}` : "Download MD package"; $("download-package").hidden = false; $("status").textContent = `${currentBody.length.toLocaleString()} characters${count ? ` · ${count} local figure${count === 1 ? "" : "s"}` : ""}`;
		}
		function tarHeader(name, size) {
			const h = new Uint8Array(512), enc = new TextEncoder(); const put = (at, width, value) => h.set(enc.encode(value).slice(0,width), at); const oct = (value, width) => value.toString(8).padStart(width - 1, "0") + "\0";
			put(0,100,name); put(100,8,"0000644\0"); put(108,8,"0000000\0"); put(116,8,"0000000\0"); put(124,12,oct(size,12)); put(136,12,oct(Math.floor(Date.now()/1000),12)); h.fill(32,148,156); h[156]=48; put(257,6,"ustar\0"); put(263,2,"00");
			const sum=h.reduce((a,b)=>a+b,0); put(148,8,`${sum.toString(8).padStart(6,"0")}\0 `); return h;
		}
		async function downloadPackage() {
			const button=$("download-package"); button.disabled=true; $("status").textContent="Preparing download…";
			try {
				const files=[{name:`${recordId}.md`,bytes:new TextEncoder().encode(packageBody)}];
				for (const path of array(currentInfo.figures)) { const response=await fetch(path); if (!response.ok) throw new Error(path); files.push({name:packageFigurePath(path),bytes:new Uint8Array(await response.arrayBuffer())}); }
				const chunks=[]; files.forEach(({name,bytes}) => { chunks.push(tarHeader(name,bytes.length),bytes,new Uint8Array((512-bytes.length%512)%512)); }); chunks.push(new Uint8Array(1024));
				const blob=await new Response(new Blob(chunks).stream().pipeThrough(new CompressionStream("gzip"))).blob(), url=URL.createObjectURL(blob), link=document.createElement("a"); link.href=url; link.download=`${recordId}-${$("document").value}.tar.gz`; link.click(); setTimeout(() => URL.revokeObjectURL(url),1000); $("status").textContent="Download ready.";
			} catch (_) { $("status").textContent="Package failed; use the plain MD and figure links separately."; } finally { button.disabled=false; }
		}
		async function showDocument(key) {
			const path=options.find((item) => item.key === key)?.path; if (!path) return; currentInfo=manifest.documents[path] || {};
			const source = key.startsWith("doc"); $("document-note").hidden = !source;
			try { const response=await fetch(path); if (!response.ok) throw new Error(); renderBody(await response.text(),currentInfo,!source); const query = standalonePath ? `path=${encodeURIComponent(standalonePath)}&doc=${encodeURIComponent(key)}` : `id=${encodeURIComponent(recordId)}&doc=${encodeURIComponent(key)}`; history.replaceState(null,"",`view.html?${query}`); } catch (_) { $("document-content").innerHTML=""; $("document-content").append(make("div","error","This document could not be loaded.")); }
		}
		async function load() {
			try {
				[catalog,manifest]=await Promise.all([fetch("../catalog.json").then((r)=>r.json()),fetch("manifest.json").then((r)=>r.json())]);
				if (standalonePath) {
					if (!standalonePath.startsWith("content/corpus/solution_ocr/")) throw new Error();
					const info = manifest.documents[standalonePath]; if (!info) throw new Error();
					record = {id: info.id || standalonePath, source_name: info.source_name || info.source || "Mathpix solution OCR", title: info.title || basename(standalonePath)};
					options = [{key:"doc0", path:standalonePath}];
				} else {
					record=array(catalog.records).find((item)=>item.id===recordId); if (!record) throw new Error();
					const local=manifest.records[recordId] || {}; options=["problem","en","hu","solution"].filter((key)=>local[key]).map((key)=>({key,path:local[key]})); array(local.solution_documents).forEach((path,i)=>options.push({key:`doc${i}`,path}));
				}
				$("meta").textContent=`${record.source_name || record.source}${record.year ? ` · ${record.year}` : ""} · ${record.title || record.problem || record.id}`;
				const select=$("document"); select.replaceChildren(...options.map((item)=>new Option(labelFor(item.key,item.path),item.key))); const wanted=params.get("doc"); select.value=options.some((item)=>item.key===wanted) ? wanted : options[0]?.key; if (!select.value) throw new Error(); showDocument(select.value);
			} catch (_) { $("meta").textContent=""; $("document-content").append(make("div","error","The record could not be loaded.")); }
		}
		$("unlock").addEventListener("submit",unlock); $("document").addEventListener("change",(event)=>showDocument(event.target.value)); $("download-package").addEventListener("click",downloadPackage);
		if (sessionStorage.getItem("physics-corpus-internal") === "1") { $("gate").hidden=true; $("app").hidden=false; load(); }
	</script>
</body>
</html>
