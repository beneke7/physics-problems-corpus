<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<meta name="robots" content="noindex,nofollow">
		<title>physics problem finder · record</title>
	<script>
		window.MathJax = {
			tex: { inlineMath: [["\\(", "\\)"], ["$", "$"]], displayMath: [["\\[", "\\]"], ["$$", "$$"]], packages: {"[+]": ["ams"]} },
			output: { font: "mathjax-newcm" },
			loader: { load: ["[tex]/ams"] },
			options: { skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"] },
			startup: { ready() { MathJax.startup.defaultReady(); window.dispatchEvent(new Event("MathJaxReady")); } }
		};
	</script>
	<script async src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>
	<style>
		@font-face { font-family:"Latin Modern Roman"; src:url("assets/fonts/latin-modern-roman-regular.woff") format("woff"); font-weight:400; font-style:normal; }
		@font-face { font-family:"Latin Modern Roman"; src:url("assets/fonts/latin-modern-roman-bold.woff") format("woff"); font-weight:700; font-style:normal; }
		@font-face { font-family:"Latin Modern Roman"; src:url("assets/fonts/latin-modern-roman-italic.woff") format("woff"); font-weight:400; font-style:italic; }
		@font-face { font-family:"Latin Modern Roman"; src:url("assets/fonts/latin-modern-roman-bolditalic.woff") format("woff"); font-weight:700; font-style:italic; }
		:root { --bg:#fff; --text:#222; --muted:#666; --line:#ccc; --red:#c00; }
		* { box-sizing:border-box; }
		body { margin:0; color:var(--text); background:var(--bg); font:14px/1.5 Verdana,Geneva,sans-serif; }
		main, #gate { width:min(980px,calc(100% - 28px)); margin:auto; }
		a { color:var(--red); }
		a:visited { color:#551a8b; }
		h1 { margin:0; font:700 20px/1.2 Georgia,serif; }
		header { display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:18px 0 10px; border-bottom:3px solid var(--red); }
		#gate { max-width:600px; padding-top:22vh; }
		#gate h1 { margin-bottom:12px; }
		form { display:flex; gap:7px; }
		input, select, button { min-height:32px; border:1px solid #aaa; border-radius:2px; background:#fff; color:var(--text); font:inherit; }
		input { min-width:0; padding:7px; }
		form input { flex:1; }
		button { padding:5px 10px; cursor:pointer; }
		button:hover, button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--red); outline-offset:1px; }
		.muted, #status { color:var(--muted); }
		#gate-message { font-size:12px; }
		.meta { color:var(--muted); font-size:13px; }
		.record-categories { display:grid; gap:3px; margin:2px 0 0; color:#555; font-size:12px; line-height:1.5; }
		.category-row { display:grid; grid-template-columns:88px minmax(0,1fr); gap:8px; }
		.category-row strong { color:#333; }
		.toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:12px 0; border-bottom:1px solid var(--line); }
		.figure-size-control { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:12px; }
		.figure-size-control[hidden] { display:none; }
		.figure-size-control input { width:110px; min-height:0; padding:0; accent-color:var(--red); }
		.figure-size-control output { min-width:32px; text-align:right; }
		#show-md, #download-package { border-color:var(--red); color:var(--red); }
		#document-content { max-width:820px; margin:0 auto; padding:18px 0 28px; font-family:"Latin Modern Roman",serif; font-size:17px; }
		#document-content mjx-container { color:inherit; }
		#document-content h1, #document-content h2, #document-content h3 { margin:1.2em 0 .35em; }
		#document-content h1 { font-size:28px; } #document-content h2 { font-size:23px; } #document-content h3 { font-size:19px; }
		#document-content p { margin:.7em 0; }
		#document-content img, #figures .figure img { max-width:var(--figure-size,70%); }
		#document-content img { display:block; height:auto; margin:14px auto; }
		#document-content pre { overflow:auto; padding:10px; background:#f5f5f5; font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace; }
		#document-content code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
		#document-content blockquote { margin-left:0; padding-left:14px; border-left:3px solid var(--line); color:#555; }
		#document-note { margin:-4px 0 12px; color:#900; font-size:12px; }
		#figures { max-width:820px; margin:0 auto; border-top:1px solid var(--line); padding:14px 0; }
		#figures h2 { margin:0 0 10px; font:700 16px Georgia,serif; }
		.figure { margin:12px 0 20px; }
		.figure img { display:block; max-height:600px; height:auto; margin:0 auto; }
		.figure a { font-size:12px; }
		.error { padding:24px 0; color:#900; }
		@media (max-width:600px) { main,#gate { width:calc(100% - 20px); } form { flex-wrap:wrap; } form input,form button { flex:1 1 100%; } .toolbar>* { flex:1 1 100%; } #document-content { font-size:16px; } }
	</style>
	<link rel="stylesheet" href="cart.css">
</head>
<body>
	<section id="gate">
		<h1>physics problem finder · internal</h1>
		<p>Enter the shared key to open the record.</p>
		<form id="unlock"><input id="key" type="password" autocomplete="current-password" placeholder="Shared key"><button>Open record</button></form>
		<p id="gate-message" class="muted" aria-live="polite"></p>
	</section>

	<main id="app" hidden>
		<header><h1>physics problem finder</h1><nav class="header-actions"><a class="header-action" href="./">Finder</a></nav></header>
		<p id="meta" class="meta">Loading record…</p>
		<p id="categories" class="record-categories"></p>
		<div class="toolbar">
			<div id="document-tabs" role="group" aria-label="Document version"></div>
			<button id="show-md" type="button" hidden>Show MD</button>
			<button id="download-package" type="button" hidden>LaTeX</button>
			<button id="cart-add-current" type="button" hidden>Add</button>
			<label id="figure-size-control" class="figure-size-control" hidden>Figure size <input id="figure-size" type="range" min="35" max="100" step="5" value="70" aria-label="Figure width"><output id="figure-size-value" for="figure-size">70%</output></label>
			<span id="status" aria-live="polite"></span>
		</div>
		<p id="document-note" hidden>Source transcription: raw PDF/OCR extraction; formatting and equations may be corrupted.</p>
		<pre id="markdown-source" hidden></pre>
		<article id="document-content"></article>
		<section id="figures" hidden><h2>Figures</h2><div id="figure-list"></div></section>
	</main>

	<script src="vendor/marked.umd.js"></script>
	<script src="render-markdown.js"></script>
	<script src="cart.js"></script>
	<script>
		const $ = (id) => document.getElementById(id);
		const KEY_HASH = "9bc33fdb9f533d2c8161fa9c72f59f4811a834cb71c1f936a5df4d6d2c321bd9";
		const params = new URLSearchParams(location.search), recordId = params.get("id"), standalonePath = params.get("path");
		const array = (v) => Array.isArray(v) ? v : [];
		const text = (v) => v === null || v === undefined ? "" : String(v);
		let catalog, manifest, record, options = [], currentBody = "", currentInfo = {};
		const RAW_FIGURE_BASE = "https://raw.githubusercontent.com/beneke7/physics-problems-corpus/master/";
		function typeset(node) {
			const run = () => {
				if (!window.MathJax?.typesetPromise) return;
				window.MathJax.typesetClear?.([node]);
				window.MathJax.typesetPromise([node]).catch(() => {});
			};
			if (window.MathJax?.startup?.promise) window.MathJax.startup.promise.then(run);
			else if (window.MathJax?.typesetPromise) run();
			else window.addEventListener("MathJaxReady", run, { once: true });
		}

		async function digest(value) {
			const bytes = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(value));
			return [...new Uint8Array(bytes)].map((b) => b.toString(16).padStart(2, "0")).join("");
		}
		async function unlock(event) {
			event.preventDefault();
			try {
				if (await digest($("key").value) !== KEY_HASH) throw new Error("wrong key");
				sessionStorage.setItem("physics-corpus-internal", "1"); $("gate").hidden = true; $("app").hidden = false; load();
			} catch (_) { $("gate-message").textContent = "That key did not match."; }
		}
		function stripFrontmatter(value) { return value.replace(/^---\n[\s\S]*?\n---\n?/, ""); }
		function cleanDisplay(value) { return value.replace(/\r\n?/g, "\n").replace(/\f/g, "\n\n").replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f\ufffd]/g, " "); }
		function basename(value) { return decodeURIComponent(value.split(/[?#]/)[0].split("/").pop() || ""); }
		function labelFor(key) { return {problem:"Problem", en:"Problem EN", hu:"Problem HU", solution:"Solution", solution_hu:"Solution HU"}[key] || `Source ${Number(key.slice(3)) + 1}`; }
		function make(tag, cls, value) { const n = document.createElement(tag); if (cls) n.className = cls; if (value !== undefined) n.textContent = value; return n; }
		function figurePath(src, info) { const name = basename(src); return array(info.figures).find((path) => basename(path) === name) || src; }
		function assetUrl(path) { return path.startsWith("content/figures/solution-ocr/") ? RAW_FIGURE_BASE + "internal/" + path : new URL(path, location.href).href; }
		function documentFigures(body, info) {
			const paths = array(info.figures).filter((path) => !/^https?:\/\//i.test(path));
			for (const match of body.matchAll(/!\[[^\]]*\]\(([^)]+)\)/g)) {
				const src = match[1].trim().split(/\s+/)[0].replace(/^<|>$/g, "");
				if (!/^https?:\/\//i.test(src)) paths.push(figurePath(src, info));
			}
			return [...new Set(paths)];
		}
		function download(blob, name) { const url=URL.createObjectURL(blob), link=document.createElement("a"); link.href=url; link.download=name; link.click(); setTimeout(()=>URL.revokeObjectURL(url),1000); }
		function renderFigures(info, seen) {
			const box = $("figures"), list = $("figure-list"); list.replaceChildren(); const paths = array(info.figures).filter((path) => !seen.has(path));
			if (!paths.length) { box.hidden = true; return; } box.hidden = false;
			paths.forEach((path) => { const figure = make("div", "figure"), img = document.createElement("img"), link = make("a", "", basename(path)), asset = assetUrl(path); img.src = asset; img.loading = "lazy"; img.decoding = "async"; link.href = asset; link.download = basename(path); figure.append(img, link); list.append(figure); });
		}
		function renderBody(body, info, renderMath = true) {
			currentBody = cleanDisplay(stripFrontmatter(body)); currentInfo = {...info, figures: documentFigures(currentBody, info)}; const content = $("document-content"); content.innerHTML = window.corpusRenderMarkdown(currentBody); if (renderMath && window.corpusHasMath(currentBody)) typeset(content);
			const seen = new Set(); content.querySelectorAll("img").forEach((img) => { const original = img.getAttribute("src") || ""; const local = figurePath(original, currentInfo); if (local !== original) { img.src = assetUrl(local); seen.add(local); } img.loading = "lazy"; img.decoding = "async"; });
			renderFigures(currentInfo, seen); $("figure-size-control").hidden = !content.querySelector("img") && !$("figure-list").querySelector("img"); $("markdown-source").textContent = currentBody; $("markdown-source").hidden = true; $("show-md").textContent = "Show MD"; $("show-md").setAttribute("aria-expanded", "false"); $("show-md").hidden = false; $("download-package").hidden = false; $("status").textContent = "";
		}
		async function downloadPackage() {
			const button=$("download-package"); button.disabled=true; $("status").textContent="Preparing download…";
			try {
				const blob=await window.buildCorpusLatexPackage([{id:record?.id || "document", document:activeDocument, record, info:currentInfo, body:currentBody, figures:array(currentInfo.figures)}], {title:"Physics problem"});
				download(blob, `${recordId || "document"}-${activeDocument}-latex.tar.gz`); $("status").textContent="";
			} catch (error) { $("status").textContent=error.message || "LaTeX package failed."; } finally { button.disabled=false; }
		}
		async function showDocument(key) {
			const path=options.find((item) => item.key === key)?.path; if (!path) return; activeDocument=key; document.querySelectorAll("#document-tabs button").forEach((button)=>button.setAttribute("aria-pressed",String(button.dataset.document===key))); window.dispatchEvent(new CustomEvent("corpus-document-change", {detail:key})); currentInfo={...(manifest.records[recordId] || {}), ...(manifest.documents[path] || {})};
			const source = key.startsWith("doc"); $("document-note").hidden = !source;
			try { const response=await fetch(path); if (!response.ok) throw new Error(); renderBody(await response.text(),currentInfo,!source); const query = standalonePath ? `path=${encodeURIComponent(standalonePath)}&doc=${encodeURIComponent(key)}` : `id=${encodeURIComponent(recordId)}&doc=${encodeURIComponent(key)}`; history.replaceState(null,"",`view.html?${query}`); } catch (_) { $("document-content").innerHTML=""; $("document-content").append(make("div","error","This document could not be loaded.")); }
		}
		async function load() {
			try {
				[catalog,manifest]=await Promise.all([fetch("../catalog.json").then((r)=>r.json()),fetch("manifest.json").then((r)=>r.json())]);
				if (standalonePath) {
					if (!standalonePath.startsWith("content/corpus/solution_ocr/")) throw new Error();
					const info = manifest.documents[standalonePath]; if (!info) throw new Error();
					record = {id: info.id || standalonePath, source_name: info.source_name || info.source || "Mathpix solution OCR", title: info.title || basename(standalonePath)};
					options = [{key:"doc0", path:standalonePath}];
				} else {
					record=array(catalog.records).find((item)=>item.id===recordId); if (!record) throw new Error();
					const local=manifest.records[recordId] || {}; options=["problem","en","hu","solution","solution_hu"].filter((key)=>local[key]).map((key)=>({key,path:local[key]})); array(local.solution_documents).forEach((path,i)=>options.push({key:`doc${i}`,path}));
				}
				$("meta").textContent=`${record.source_name || record.source}${record.year ? ` · ${record.year}` : ""} · ${record.title || record.problem || record.id}`;
				const categories = [["Topics",record.topics],["Subtopics",record.subtopics],["Techniques",record.techniques],["Ideas",array(record.ideas).map((idea)=>catalog.idea_labels?.[idea] || idea)],["Math",record.math_tools]].filter(([,values])=>array(values).length);
				$("categories").replaceChildren(...categories.map(([label,values])=>{const row=make("div","category-row"), name=make("strong","",label), value=make("span","",array(values).join(", ")); row.append(name,value); return row;}));
				const wanted=params.get("doc"), initial=options.some((item)=>item.key===wanted) ? wanted : options[0]?.key, tabs=$("document-tabs");
				tabs.replaceChildren(...options.map((item)=>{const button=make("button","document-tab",labelFor(item.key,item.path)); button.type="button"; button.dataset.document=item.key; button.setAttribute("aria-pressed",String(item.key===initial)); return button;})); if (!initial) throw new Error(); showDocument(initial);
			} catch (_) { $("meta").textContent=""; $("document-content").append(make("div","error","The record could not be loaded.")); }
		}
		let activeDocument="problem";
		$("unlock").addEventListener("submit",unlock); $("document-tabs").addEventListener("click",(event)=>{const button=event.target.closest("[data-document]"); if(button) showDocument(button.dataset.document);}); $("download-package").addEventListener("click",downloadPackage);
		$("show-md").addEventListener("click",()=>{const source=$("markdown-source"),show=source.hidden; source.hidden=!show; $("show-md").textContent=show?"Hide MD":"Show MD"; $("show-md").setAttribute("aria-expanded",String(show));});
		$("figure-size").addEventListener("input",(event)=>{const size=`${event.currentTarget.value}%`; document.documentElement.style.setProperty("--figure-size",size); $("figure-size-value").value=size;});
		if (sessionStorage.getItem("physics-corpus-internal") === "1") { $("gate").hidden=true; $("app").hidden=false; load(); }
	</script>
</body>
</html>
